[project]
name = "bifurcagym"
version = "0.1.0"
description = "A JAX benchmark of reinforcement learning and control environments with chaotic dynamics"
authors = [
    {name = "James Rudd-Jones", email = "james.rudd.jones@gmail.com"},
    {name = "Mirco Musolesi"},
    {name = "María Pérez-Ortiz"},
]
dependencies = [
    "matplotlib>=3.10.3",
    "cmocean>=4.0.3",
    # HydroGym wrapper relies on internals of the matching JAX and the cuda extra below must pin the same version
    "jax==0.6.0",
    "flax>=0.10.6",
    "chex>=0.1.90",
]
requires-python = ">=3.11,<3.13"
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
baselines = [
    "optax>=0.2.7",
    "distrax>=0.1.5",
    "wandb>=0.21.0",
]
# Only used by the unregistered envs in experimental/
experimental = [
    "phiflow>=3.4.0",
    "jax-cfd>=0.2.1",
    "seaborn>=0.13.2",
    "xarray>=2025.6.1",
    "tqdm>=4.67.1",
]
cuda = [
    "jax[cuda12]==0.6.0",
]
# HydroGym's JAX backend envs, the wrapper uses hydrogym internals so pinned to the 1.0 series
hydrogym = [
    "hydrogym[jax]~=1.0.0",
]
mujoco = [
    "mujoco-mjx>=4.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.1.11",
    "pytest>=7.4.4",
    "pytest-xdist>=3.5.0",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm.scripts]
test.cmd = "systemd-run --user --scope --quiet -p MemoryMax=16G -p MemorySwapMax=0 nice -n 10 pytest -n 4 --dist load"
test-all.cmd = "systemd-run --user --scope --quiet -p MemoryMax=16G -p MemorySwapMax=0 nice -n 10 pytest -n 4 --dist load -m ''"
test-physics.cmd = "systemd-run --user --scope --quiet -p MemoryMax=16G -p MemorySwapMax=0 nice -n 10 pytest -n 4 --dist load -m physics tests/physics"
# ruff lints and sorts imports only, no auto-formatter so hand-aligned layout is left alone
lint.cmd = "ruff check ."
fmt.cmd = "ruff check --fix ."

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow and not render and not physics'"
markers = [
    "slow: environments that take minutes per test on CPU",
    "render: tests that render trajectories to gifs",
    "physics: physical validity checks of the environment dynamics",
]

[tool.ruff]
line-length = 120
extend-exclude = ["experimental"]  # unregistered work in progress envs and scratch scripts

[tool.ruff.lint]
select = ["E",
          "W",
          "F",
          "I",
          "B",
          "UP",
          "SIM",
          "C4",
          "PIE",
          "NPY",
          "PTH",
          ]
ignore = ["E731",
          "SIM108",
          "PTH123",
          ]
unfixable = ["F401",  # report unused imports but never auto-delete them (eg sys kept for debugging)
             ]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports are re-exports

[tool.ruff.lint.isort]
lines-after-imports = 2
force-single-line = true
force-sort-within-sections = true
single-line-exclusions = ["typing"]
